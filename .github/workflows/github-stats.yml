name: Generate GitHub Stats Card

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # manual run button
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stats card
        env:
          # Optional: add a PAT as repo secret STATS_TOKEN (scopes: read:user, repo)
          # to also count private contributions. Falls back to GITHUB_TOKEN.
          TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          mkdir -p assets
          python - <<'PY'
          import os, json, urllib.request
          from datetime import datetime, timedelta, timezone
          from xml.sax.saxutils import escape

          TOKEN = os.environ["TOKEN"]
          LOGIN = os.environ["LOGIN"]

          def gql(query, variables):
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps({"query": query, "variables": variables}).encode(),
                  headers={"Authorization": f"bearer {TOKEN}", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req) as r:
                  data = json.load(r)
              if "errors" in data:
                  raise SystemExit(data["errors"])
              return data["data"]

          now = datetime.now(timezone.utc)
          iso = lambda d: d.strftime("%Y-%m-%dT%H:%M:%SZ")

          # ---- profile basics ----
          info = gql("""
          query($login:String!){
            user(login:$login){
              name createdAt
              pullRequests{totalCount}
              repositories(ownerAffiliations:OWNER){totalCount}
            }
          }""", {"login": LOGIN})["user"]

          display = info["name"] or LOGIN
          first_name = display.split()[0]
          created = datetime.fromisoformat(info["createdAt"].replace("Z", "+00:00"))
          repos = info["repositories"]["totalCount"]
          prs = info["pullRequests"]["totalCount"]

          # ---- stars earned (sum over owned repos) ----
          stars, after = 0, None
          while True:
              d = gql("""
              query($login:String!,$after:String){
                user(login:$login){
                  repositories(first:100, ownerAffiliations:OWNER, after:$after){
                    nodes{stargazerCount}
                    pageInfo{hasNextPage endCursor}
                  }
                }
              }""", {"login": LOGIN, "after": after})["user"]["repositories"]
              stars += sum(n["stargazerCount"] for n in d["nodes"])
              if not d["pageInfo"]["hasNextPage"]:
                  break
              after = d["pageInfo"]["endCursor"]

          # ---- contributions (last 1y) ----
          CAL = """
          query($login:String!,$from:DateTime!,$to:DateTime!){
            user(login:$login){
              contributionsCollection(from:$from,to:$to){
                contributionCalendar{
                  totalContributions
                  weeks{contributionDays{date contributionCount}}
                }
              }
            }
          }"""
          last_year = gql(CAL, {"login": LOGIN, "from": iso(now - timedelta(days=365)), "to": iso(now)})
          contributions = last_year["user"]["contributionsCollection"]["contributionCalendar"]["totalContributions"]

          # ---- every contribution day since account creation (for streaks) ----
          days = {}
          for year in range(created.year, now.year + 1):
              f = datetime(year, 1, 1, tzinfo=timezone.utc)
              t = min(datetime(year, 12, 31, 23, 59, 59, tzinfo=timezone.utc), now)
              cal = gql(CAL, {"login": LOGIN, "from": iso(f), "to": iso(t)})
              cal = cal["user"]["contributionsCollection"]["contributionCalendar"]
              for w in cal["weeks"]:
                  for day in w["contributionDays"]:
                      days[day["date"]] = day["contributionCount"]

          dates = sorted(days)
          longest = run = 0
          prev = None
          for ds in dates:
              d = datetime.strptime(ds, "%Y-%m-%d").date()
              if days[ds] > 0:
                  run = run + 1 if prev and (d - prev).days == 1 else 1
                  longest = max(longest, run)
                  prev = d
              else:
                  run, prev = 0, None

          today = now.date()
          cursor = today if days.get(today.isoformat(), 0) > 0 else today - timedelta(days=1)
          current = 0
          while days.get(cursor.isoformat(), 0) > 0:
              current += 1
              cursor -= timedelta(days=1)

          # ---- render SVG ----
          stats = [
              (f"{contributions:,}", "Contributions (1y)"),
              (f"{current}d", "Current streak"),
              (f"{longest}d", "Longest streak"),
              (f"{stars:,}", "Stars earned"),
              (f"{repos:,}", "Repositories"),
              (f"{prs:,}", "Pull requests"),
          ]

          W, H = 1105, 227
          card_x, card_y, card_w, card_h = 18, 20, 1056, 187
          col_w = (card_w - 56) / len(stats)
          start_x = card_x + 28 + col_w / 2

          cols = ""
          for i, (val, label) in enumerate(stats):
              cx = start_x + i * col_w
              cols += (
                  f'<text x="{cx:.1f}" y="{card_y + 105}" text-anchor="middle" '
                  f'class="num">{escape(val)}</text>'
                  f'<text x="{cx:.1f}" y="{card_y + 131}" text-anchor="middle" '
                  f'class="lbl">{escape(label)}</text>'
              )

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" role="img" aria-label="{escape(first_name)}'s GitHub Stats">
            <style>
              .title {{ font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f0f6fc; }}
              .num   {{ font: 700 38px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #58a6ff; }}
              .lbl   {{ font: 400 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8b949e; }}
            </style>
            <rect width="{W}" height="{H}" fill="#0d1117"/>
            <rect x="{card_x}" y="{card_y}" width="{card_w}" height="{card_h}" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
            <text x="{card_x + 28}" y="{card_y + 44}" class="title">{escape(first_name)}'s GitHub Stats</text>
            {cols}
          </svg>
          """
          with open("assets/github-stats.svg", "w", encoding="utf-8") as fh:
              fh.write(svg)
          print("Generated assets/github-stats.svg")
          PY

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update GitHub stats card"
            git pull --rebase origin main
            git push origin main
          fi
